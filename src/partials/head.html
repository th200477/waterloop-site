<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<link rel="canonical" href="https://waterloop.jp{{path}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:url" content="https://waterloop.jp{{path}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WATER LOOP PROJECT">
<link rel="icon" href="/favicon.png">
<!-- 動き：JSが動くときだけ「出てくる前」の状態で隠す。ページを読み終えても main.js が動いていなければ隠すのをやめる（消えたままにしない保険。時間で切るとスマホの遅い回線で動きが消えるため） -->
<script>document.documentElement.classList.add('js');window.addEventListener('load',function(){if(!window.__motion)document.documentElement.classList.remove('js');});</script>
<!-- Manrope は今のサイトと同じファイルを自前で置く（src/fonts/、OFL）。Noto Sans JP / Zen Old Mincho は Google Fonts -->
<link rel="preload" href="/fonts/Manrope-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6TF6ET18RQ"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-6TF6ET18RQ');</script>
