<!--#title Contact｜WATER LOOP PROJECT-->
<!--#desc Water Loop Projectに関するご質問、ご相談、取材や協業のご提案などがありましたら、こちらからご連絡ください。-->
<!--#head <link rel="stylesheet" href="/css/pages/legal.css"><script src="/js/pages/contact.js" defer></script>-->
<main class="legal contact">
  <header class="legal__head">
    <div class="legal__title">
      <h1>CONTACT</h1>
      <img src="/svg/8e2f5fd8098d9273fe010f33208bd0c4dce3d354.svg" alt="" width="80" height="14">
    </div>
  </header>
  <div class="legal__body">
    <div class="contact__lead">
      <p>Water Loop Projectに関するご質問、ご相談、取材や協業のご提案などがありましたら、こちらからご連絡ください。</p>
      <p>水をめぐる取り組みや、このプロジェクトの考え方にご関心を持っていただけた方との対話を大切にしています。</p>
    </div>
  </div>
  <div class="contact__open">
    <a class="contact__btn" href="#contact-form" aria-controls="contact-form" aria-expanded="false" data-contact-open>お問い合わせフォームを開く<img src="/svg/a207ac095b45fd81c1c1f05749896f171ba52e80.svg" alt="" width="16" height="15"></a>
  </div>
  <form class="contact-form" id="contact-form" name="contact" method="POST" action="/contact/thanks" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="contact">
    <p class="hp" aria-hidden="true"><label>この欄は入力しないでください<input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
    <div class="contact-form__field">
      <label for="cf-name">お名前<span class="req">必須</span></label>
      <input id="cf-name" name="name" type="text" autocomplete="name" required>
    </div>
    <div class="contact-form__field">
      <label for="cf-email">メールアドレス<span class="req">必須</span></label>
      <input id="cf-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="contact-form__field">
      <label for="cf-message">お問い合わせ内容<span class="req">必須</span></label>
      <textarea id="cf-message" name="message" required></textarea>
    </div>
    <p class="contact-form__note">送信前に<a href="/privacy-policy">プライバシーポリシー</a>をご確認ください。</p>
    <button class="contact-form__submit" type="submit">送信する</button>
  </form>
</main>
