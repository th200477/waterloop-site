<!--#title Contact｜WATER LOOP PROJECT-->
<!--#desc WATER LOOP PROJECTに関するご質問、ご相談、取材や協業のご提案などがありましたら、こちらからご連絡ください。-->
<!--#head <link rel="stylesheet" href="/css/pages/legal.css"><link rel="stylesheet" href="/css/pages/contact.css"><script src="/js/pages/contact.js" defer></script>-->
<main class="legal contact">
  <header class="legal__head">
    <div class="legal__title">
      <h1>CONTACT</h1>
      <img src="/svg/8e2f5fd8098d9273fe010f33208bd0c4dce3d354.svg" alt="" width="80" height="14">
    </div>
  </header>
  <div class="legal__body">
    <div class="contact__lead" id="cf-lead">
      <p>WATER LOOP PROJECTに関するご質問、ご相談、取材や協業のご提案などがありましたら、こちらからご連絡ください。</p>
      <p>水をめぐる取り組みや、このプロジェクトの考え方にご関心を持っていただけた方との対話を大切にしています。</p>
    </div>
  </div>

  <ol class="cf-steps" aria-label="送信までの流れ">
    <li class="is-on" data-step="input">入力</li>
    <li data-step="confirm">確認</li>
    <li data-step="done">送信完了</li>
  </ol>

  <form class="cf" id="cf" novalidate>
    <div class="cf__field">
      <label for="cf-type">相談の種類<span class="cf__req">必須</span></label>
      <div class="cf__select">
        <select id="cf-type" name="type" required>
          <option value="">選んでください</option>
          <option value="trip">旅行・研修に組み込みたい</option>
          <option value="make">一緒に商品やサービスをつくりたい</option>
          <option value="press">取材・講演の依頼</option>
          <option value="other">その他</option>
        </select>
      </div>
    </div>
    <div class="cf__field" id="cf-content-row" hidden>
      <label for="cf-content">相談したいコンテンツ</label>
      <input id="cf-content" name="content" type="text" autocomplete="off">
    </div>
    <div class="cf__field">
      <label for="cf-name">お名前<span class="cf__req">必須</span></label>
      <input id="cf-name" name="name" type="text" autocomplete="name" required>
    </div>
    <div class="cf__field">
      <label for="cf-org">会社・団体名</label>
      <input id="cf-org" name="org" type="text" autocomplete="organization">
    </div>
    <div class="cf__field">
      <label for="cf-email">メールアドレス<span class="cf__req">必須</span></label>
      <input id="cf-email" name="email" type="email" autocomplete="email" inputmode="email" required>
    </div>
    <div class="cf__field">
      <label for="cf-tel">電話番号</label>
      <input id="cf-tel" name="tel" type="tel" autocomplete="tel" inputmode="tel">
    </div>
    <div class="cf__field">
      <label for="cf-message">内容<span class="cf__req">必須</span></label>
      <textarea id="cf-message" name="message" rows="8" required placeholder="時期・人数・ご予算など、決まっていることがあればお書きください。"></textarea>
    </div>
    <div class="cf__hp" aria-hidden="true">
      <label for="cf-website">ウェブサイト</label>
      <input id="cf-website" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>
    <div class="cf__agree">
      <label><input id="cf-agree" name="agree" type="checkbox" required><span><a href="/privacy-policy">プライバシーポリシー</a>に同意する<span class="cf__req">必須</span></span></label>
    </div>
    <p class="cf__error" id="cf-error" role="alert"></p>
    <div class="cf__actions">
      <button class="btn-pill btn--jp cf__btn cf__btn--primary" type="submit">入力内容を確認する</button>
    </div>
  </form>

  <section class="cf cf-confirm" id="cf-confirm" hidden aria-labelledby="cf-confirm-h">
    <h2 class="cf-confirm__h" id="cf-confirm-h">入力内容をご確認ください</h2>
    <dl class="cf-confirm__list" id="cf-confirm-list"></dl>
    <p class="cf__error" id="cf-send-error" role="alert"></p>
    <div class="cf__actions">
      <button class="btn-pill btn--jp btn--blue cf__btn" type="button" id="cf-back">戻って直す</button>
      <button class="btn-pill btn--jp cf__btn cf__btn--primary" type="button" id="cf-send">この内容で送信する</button>
    </div>
  </section>

  <section class="cf cf-done" id="cf-done" hidden aria-labelledby="cf-done-h" tabindex="-1">
    <h2 class="cf-done__h" id="cf-done-h">お問い合わせありがとうございます。</h2>
    <p>内容を受け付けました。<br>ご入力のメールアドレスに、受付のお知らせをお送りしています。</p>
    <p>数日以内に担当者からご連絡します。<br>メールが届かない場合は、迷惑メールのフォルダもご確認ください。</p>
    <div class="cf__actions">
      <a class="btn-pill btn--jp btn--blue cf__btn" href="/">トップへ戻る</a>
    </div>
  </section>
  <!--#contents-names-->
</main>
