<!-- お知らせのカード1枚。gen_lists.py が一覧の印（#list news）を置き換えるときに使う -->
<a class="news-card" href="/news-2/{{slug}}">
  <span class="news-card__row">
    <span class="news-card__img"><img src="/img/{{hero}}.webp" alt="" width="{{hero_w}}" height="{{hero_h}}" loading="lazy"></span>
    <span class="news-card__body">
      <span class="news-card__title">{{title}}</span>
      <span class="news-card__date">{{date_label}}</span>
    </span>
  </span>
</a>
