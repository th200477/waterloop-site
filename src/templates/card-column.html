<!-- コラムのカード1枚。gen_lists.py が一覧の印（#list columns）を置き換えるときに使う -->
<a class="col-card" href="/blog/{{slug}}">
  <span class="col-card__img"><img src="/img/{{hero}}.webp" alt="" width="{{hero_w}}" height="{{hero_h}}" loading="lazy"></span>
  <span class="col-card__body">
    <span class="col-card__title">{{title}}</span>
    <span class="col-card__date">{{date_label}}</span>
  </span>
</a>
